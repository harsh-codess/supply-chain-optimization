# Supply Chain Risk Monitor — Cloud Run Deployment
# Usage: gcloud builds submit --config cloudbuild.yaml

substitutions:
  _SERVICE_NAME: supply-chain-backend
  _REGION: us-central1
  _IMAGE: gcr.io/supply-chain-76169/supply-chain-backend

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '$_IMAGE:latest'
      - '.'
    dir: 'backend'

  # Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '$_IMAGE:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - '--image=$_IMAGE:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GEMINI_API_KEY=AIzaSyBXsdI9Pkz-M_zWy5N80NDXBRQ6SlJ0uqs,OPENWEATHER_API_KEY=d13ed844b16f346128a7641675acfb91,GOOGLE_MAPS_API_KEY=AIzaSyBLme1rE9xCWsCtDUBrKNY4Rd41hDQ72jw'

images:
  - '$_IMAGE:latest'

options:
  logging: CLOUD_LOGGING_ONLY
